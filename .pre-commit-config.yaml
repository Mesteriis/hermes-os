minimum_pre_commit_version: "3.2.0"
default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: hermes-fast-checks
        name: Hermes fast checks
        entry: make pre-commit
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-commit

      - id: hermes-full-verification
        name: Hermes full verification
        entry: make pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
