[package]
name = "hermes-mail-address-book-persistence"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = []
conformance-test-support = []

[package.metadata.hermes]
role = "integration"
owner = "mail"
surface = "persistence"

[dependencies]
hermes-events-protocol = { path = "../platform/events" }
hermes-mail-address-book-contract = { path = "../mail-address-book-contract" }
hermes-storage-protocol = { path = "../platform/storage/protocol" }
prost = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
