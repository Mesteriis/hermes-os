[package]
name = "hermes-ollama-ai-http"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[package.metadata.hermes]
role = "integration"
owner = "ollama"
surface = "implementation"

[dependencies]
async-std = "=1.13.2"
hermes-ollama-ai-api = { path = "../ollama-ai-api" }
hermes-ollama-ai-core = { path = "../ollama-ai-core" }
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = "=1.0.150"
zeroize = "=1.9.0"
