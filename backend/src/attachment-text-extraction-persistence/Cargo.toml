[package]
name = "hermes-attachment-text-extraction-persistence"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[package.metadata.hermes]
role = "workflow"
owner = "attachment_text_extraction"
surface = "persistence"

[dependencies]
hermes-attachment-text-extraction-core = { path = "../attachment-text-extraction-core" }
hermes-storage-protocol = { path = "../platform/storage/protocol" }
sha2 = { version = "=0.11.0", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
