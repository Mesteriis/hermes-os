[package]
name = "hermes-review-task-candidate-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hermes-review-task-candidate-runtime"
path = "src/main.rs"

[package.metadata.hermes]
role = "domain"
owner = "review"
surface = "runtime"

[dependencies]
hermes-review-task-candidate-api = { path = "../review-task-candidate-api" }
hermes-review-task-candidate-core = { path = "../review-task-candidate-core" }
hermes-review-task-candidate-persistence = { path = "../review-task-candidate-persistence" }
hermes-runtime-protocol = { path = "../platform/runtime_protocol" }
prost = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
