[package]
name = "hermes-mail-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "hermes-mail-runtime"
path = "src/main.rs"

[lib]
name = "hermes_mail_runtime"
path = "src/lib.rs"

[features]
default = []
conformance-test-support = [
    "hermes-mail-api/conformance-test-support",
    "hermes-mail-carddav/conformance-test-support",
    "hermes-mail-gmail/conformance-test-support",
    "hermes-mail-google-people/conformance-test-support",
    "hermes-mail-imap/conformance-test-support",
]

[package.metadata.hermes]
role = "integration"
owner = "mail"
surface = "runtime"

[dependencies]
hermes-mail-api = { path = "../mail-api" }
hermes-mail-core = { path = "../mail-core" }
hermes-mail-imap = { path = "../mail-imap" }
hermes-mail-gmail = { path = "../mail-gmail" }
hermes-mail-smtp = { path = "../mail-smtp" }
hermes-mail-persistence = { path = "../mail-persistence" }
hermes-mail-address-book-contract = { path = "../mail-address-book-contract" }
hermes-mail-address-book-persistence = { path = "../mail-address-book-persistence" }
hermes-mail-google-people = { path = "../mail-google-people" }
hermes-mail-carddav = { path = "../mail-carddav" }
hermes-contacts-mail-sync-source-api = { path = "../contacts-mail-sync-source-api" }
hermes-mail-delivery-intent-contract = { path = "../mail-delivery-intent-contract" }
hermes-attachment-security-contract = { path = "../attachment-security-contract" }
hermes-communications-attachment-contract = { path = "../communications-attachment-contract" }
hermes-communications-ingress = { path = "../communications-ingress" }
hermes-blob-client = { path = "../platform/blob/client" }
hermes-events-protocol = { path = "../platform/events" }
hermes-events-jetstream = { path = "../platform/events/jetstream" }
hermes-managed-vault-client = { path = "../platform/vault/managed_client" }
hermes-runtime-protocol = { path = "../platform/runtime_protocol" }
hermes-storage-protocol = { path = "../platform/storage/protocol" }
hermes-storage-vault = { path = "../platform/storage/vault" }
hermes-vault-protocol = { path = "../platform/vault/protocol" }
hermes-mail-retained-evidence-replay-persistence = { path = "../mail-retained-evidence-replay-persistence" }
hermes-mail-retained-evidence-replay-contract = { path = "../mail-retained-evidence-replay-contract" }
libc = "=0.2.186"
getrandom = { version = "=0.4.3", default-features = false }
prost = "=0.14.4"
prost-types = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.52.4", default-features = false, features = ["rt-multi-thread", "time"] }
zeroize = "=1.9.0"
