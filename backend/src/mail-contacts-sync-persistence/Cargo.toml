[package]
name = "hermes-mail-contacts-sync-persistence"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[package.metadata.hermes]
role = "workflow"
owner = "mail_contacts_sync"
surface = "persistence"

[features]
default = []
conformance-test-support = []

[dependencies]
hermes-mail-contacts-sync-core = { path = "../mail-contacts-sync-core" }
hermes-storage-protocol = { path = "../platform/storage/protocol" }
sha2 = { version = "=0.11.0", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
