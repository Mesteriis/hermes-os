[package]
name = "hermes-ollama-ai-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hermes-ollama-ai-runtime"
path = "src/main.rs"

[package.metadata.hermes]
role = "integration"
owner = "ollama"
surface = "runtime"

[dependencies]
hermes-ai-contracts = { path = "../ai-contracts" }
hermes-ollama-ai-api = { path = "../ollama-ai-api" }
hermes-ollama-ai-core = { path = "../ollama-ai-core" }
hermes-ollama-ai-http = { path = "../ollama-ai-http" }
hermes-ollama-ai-persistence = { path = "../ollama-ai-persistence" }
hermes-runtime-protocol = { path = "../platform/runtime_protocol" }
hermes-storage-protocol = { path = "../platform/storage/protocol" }
hermes-storage-vault = { path = "../platform/storage/vault" }
libc = "=0.2.186"
prost = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.52.4", default-features = false, features = ["rt-multi-thread", "time"] }
zeroize = "=1.9.0"
