[package]
name = "hermes-communications-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "hermes-communications-runtime"
path = "src/main.rs"

[lib]
name = "hermes_communications_runtime"
path = "src/lib.rs"

[package.metadata.hermes]
role = "domain"
owner = "communications"
surface = "runtime"

[dependencies]
hermes-communications-api = { path = "../communications-api" }
hermes-communications-ai-source-api = { path = "../communications-ai-source-api" }
hermes-communications-attachment-contract = { path = "../communications-attachment-contract" }
hermes-communications-call-evidence-api = { path = "../communications-call-evidence-api" }
hermes-communications-call-evidence-core = { path = "../communications-call-evidence-core" }
hermes-communications-call-evidence-ingress = { path = "../communications-call-evidence-ingress" }
hermes-communications-call-evidence-persistence = { path = "../communications-call-evidence-persistence" }
hermes-communications-content-api = { path = "../communications-content-api" }
hermes-communications-evidence-export-source-api = { path = "../communications-evidence-export-source-api" }
hermes-communications-cross-channel-forward-source-api = { path = "../communications-cross-channel-forward-source-api" }
hermes-communications-saved-query-api = { path = "../communications-saved-query-api" }
hermes-communications-sender-insights-api = { path = "../communications-sender-insights-api" }
hermes-communications-domain = { path = "../communications-domain" }
hermes-communications-ingress = { path = "../communications-ingress" }
hermes-communications-note-source-api = { path = "../communications-note-source-api" }
hermes-communications-persistence = { path = "../communications-persistence" }
hermes-communications-recipient-source-api = { path = "../communications-recipient-source-api" }
hermes-communications-retained-evidence-replay-persistence = { path = "../communications-retained-evidence-replay-persistence" }
hermes-communications-task-source-api = { path = "../communications-task-source-api" }
hermes-blob-client = { path = "../platform/blob/client" }
hermes-events-jetstream = { path = "../platform/events/jetstream" }
hermes-events-protocol = { path = "../platform/events" }
hermes-runtime-protocol = { path = "../platform/runtime_protocol" }
hermes-storage-protocol = { path = "../platform/storage/protocol" }
hermes-storage-vault = { path = "../platform/storage/vault" }
hermes-managed-vault-client = { path = "../platform/vault/managed_client" }
getrandom = "=0.4.3"
libc = "=0.2.186"
prost = "=0.14.4"
prost-types = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.52.4", default-features = false, features = ["rt", "rt-multi-thread", "time"] }
zeroize = "=1.9.0"
