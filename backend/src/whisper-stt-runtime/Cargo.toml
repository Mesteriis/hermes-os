[package]
name = "hermes-whisper-stt-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hermes-whisper-stt-runtime"
path = "src/main.rs"

[package.metadata.hermes]
role = "integration"
owner = "whisper_stt"
surface = "runtime"

[dependencies]
hermes-blob-client = { path = "../platform/blob/client" }
hermes-runtime-protocol = { path = "../platform/runtime_protocol" }
hermes-speech-to-text-api = { path = "../speech-to-text-api" }
hermes-storage-protocol = { path = "../platform/storage/protocol" }
hermes-storage-vault = { path = "../platform/storage/vault" }
hermes-whisper-stt-core = { path = "../whisper-stt-core" }
hermes-whisper-stt-persistence = { path = "../whisper-stt-persistence" }
hermes-whisper-stt-process = { path = "../whisper-stt-process" }
libc = "=0.2.186"
prost = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.52.4", default-features = false, features = ["rt-multi-thread", "time"] }
zeroize = "=1.9.0"
