[package]
name = "hermes-attachment-translation-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hermes-attachment-translation-runtime"
path = "src/main.rs"

[package.metadata.hermes]
role = "workflow"
owner = "attachment_translation"
surface = "runtime"

[dependencies]
getrandom = "=0.4.3"
hermes-ai-contracts = { path = "../ai-contracts" }
hermes-blob-client = { path = "../platform/blob/client" }
hermes-attachment-translation-api = { path = "../attachment-translation-api" }
hermes-attachment-translation-core = { path = "../attachment-translation-core" }
hermes-attachment-translation-ingress = { path = "../attachment-translation-ingress" }
hermes-attachment-translation-persistence = { path = "../attachment-translation-persistence" }
hermes-events-jetstream = { path = "../platform/events/jetstream" }
hermes-events-protocol = { path = "../platform/events" }
hermes-runtime-protocol = { path = "../platform/runtime_protocol" }
hermes-storage-protocol = { path = "../platform/storage/protocol" }
hermes-storage-vault = { path = "../platform/storage/vault" }
libc = "=0.2.186"
prost = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.52.4", default-features = false, features = ["rt-multi-thread", "time"] }
zeroize = "=1.9.0"
