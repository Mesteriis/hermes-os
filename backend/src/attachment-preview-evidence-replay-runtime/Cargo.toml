[package]
name = "hermes-attachment-preview-evidence-replay-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hermes-attachment-preview-evidence-replay-runtime"
path = "src/main.rs"

[package.metadata.hermes]
role = "workflow"
owner = "attachment_preview_evidence_replay"
surface = "runtime"

[dependencies]
hermes-attachment-preview-evidence-replay-api = { path = "../attachment-preview-evidence-replay-api" }
hermes-attachment-preview-evidence-replay-core = { path = "../attachment-preview-evidence-replay-core" }
hermes-attachment-preview-evidence-replay-persistence = { path = "../attachment-preview-evidence-replay-persistence" }
hermes-communications-retained-evidence-replay-contract = { path = "../communications-retained-evidence-replay-contract" }
hermes-events-jetstream = { path = "../platform/events/jetstream" }
hermes-mail-retained-evidence-replay-contract = { path = "../mail-retained-evidence-replay-contract" }
hermes-runtime-protocol = { path = "../platform/runtime_protocol" }
prost = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
