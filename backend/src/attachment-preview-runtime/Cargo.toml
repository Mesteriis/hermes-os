[package]
name = "hermes-attachment-preview-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hermes-attachment-preview-runtime"
path = "src/main.rs"

[package.metadata.hermes]
role = "workflow"
owner = "attachment_preview"
surface = "runtime"

[dependencies]
hermes-attachment-preview-api = { path = "../attachment-preview-api" }
hermes-attachment-preview-core = { path = "../attachment-preview-core" }
hermes-attachment-preview-docx = { path = "../attachment-preview-docx" }
hermes-attachment-preview-image = { path = "../attachment-preview-image" }
hermes-attachment-preview-ingress = { path = "../attachment-preview-ingress" }
hermes-attachment-preview-media = { path = "../attachment-preview-media" }
hermes-attachment-preview-pdf = { path = "../attachment-preview-pdf" }
hermes-attachment-preview-persistence = { path = "../attachment-preview-persistence" }
hermes-attachment-preview-renderer-contract = { path = "../attachment-preview-renderer-contract" }
hermes-attachment-preview-text = { path = "../attachment-preview-text" }
hermes-attachment-security-contract = { path = "../attachment-security-contract" }
hermes-blob-client = { path = "../platform/blob/client" }
hermes-communications-attachment-contract = { path = "../communications-attachment-contract" }
hermes-events-jetstream = { path = "../platform/events/jetstream" }
hermes-events-protocol = { path = "../platform/events" }
hermes-runtime-protocol = { path = "../platform/runtime_protocol" }
hermes-storage-protocol = { path = "../platform/storage/protocol" }
hermes-storage-vault = { path = "../platform/storage/vault" }
getrandom = { version = "=0.4.3", default-features = false }
libc = "=0.2.186"
prost = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.52.4", default-features = false, features = ["rt-multi-thread", "time"] }
zeroize = "=1.9.0"
