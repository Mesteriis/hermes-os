syntax = "proto3";

package hermes.communications.ai_source.v1;

// Exact workflow command into the Communications-owned AI source port.
// Target authority is compile-time fixed and is never selected by the payload.
message PrepareCommunicationReplySourceCommandV1 {
  bytes run_id = 1;
  bytes source_message_id = 2;
  uint64 expected_source_revision = 3;
  string logical_owner_id = 4;
}

message CommunicationReplySourcePreparedV1 {
  bytes run_id = 1;
  bytes source_message_id = 2;
  bytes source_evidence_id = 3;
  uint64 source_evidence_revision = 4;
  CommunicationReplySourceContentReceiptV1 source_content = 5;
  string logical_owner_id = 6;
}

message CommunicationReplySourceRejectedV1 {
  bytes run_id = 1;
  CommunicationReplySourceRejectCodeV1 code = 2;
  string logical_owner_id = 3;
}

message CommunicationReplySourceContentReceiptV1 {
  bytes reference_id = 1;
  uint64 declared_bytes = 2;
  bytes sha256 = 3;
  bytes custody_transfer_source_proof = 4;
}

// Exact plaintext schema inside the target-bound source Blob. The durable
// result carries only the receipt above, never these private bytes.
message CommunicationReplySourceContentV1 {
  bytes sender_utf8 = 1;
  bytes subject_utf8 = 2;
  bytes body_utf8 = 3;
}

enum CommunicationReplySourceRejectCodeV1 {
  COMMUNICATION_REPLY_SOURCE_REJECT_CODE_UNSPECIFIED = 0;
  COMMUNICATION_REPLY_SOURCE_REJECT_CODE_INVALID_REQUEST = 1;
  COMMUNICATION_REPLY_SOURCE_REJECT_CODE_SOURCE_MISSING_OR_INACTIVE = 2;
  COMMUNICATION_REPLY_SOURCE_REJECT_CODE_STALE_REVISION = 3;
  COMMUNICATION_REPLY_SOURCE_REJECT_CODE_CONTENT_UNAVAILABLE = 4;
  COMMUNICATION_REPLY_SOURCE_REJECT_CODE_INVALID_UTF8 = 5;
  COMMUNICATION_REPLY_SOURCE_REJECT_CODE_CONTENT_LIMIT = 6;
  COMMUNICATION_REPLY_SOURCE_REJECT_CODE_POLICY = 7;
}

message PrepareCommunicationSummarySourceCommandV1 {
  bytes run_id = 1;
  bytes source_message_id = 2;
  uint64 expected_source_revision = 3;
  string logical_owner_id = 4;
}

message CommunicationSummarySourcePreparedV1 {
  bytes run_id = 1;
  bytes source_message_id = 2;
  bytes source_evidence_id = 3;
  uint64 source_evidence_revision = 4;
  CommunicationSummarySourceContentReceiptV1 source_content = 5;
  string logical_owner_id = 6;
}

message CommunicationSummarySourceRejectedV1 {
  bytes run_id = 1;
  CommunicationSummarySourceRejectCodeV1 code = 2;
  string logical_owner_id = 3;
}

message CommunicationSummarySourceContentReceiptV1 {
  bytes reference_id = 1;
  uint64 declared_bytes = 2;
  bytes sha256 = 3;
  bytes custody_transfer_source_proof = 4;
}

message CommunicationSummarySourceContentV1 {
  bytes sender_utf8 = 1;
  bytes subject_utf8 = 2;
  bytes body_utf8 = 3;
}

enum CommunicationSummarySourceRejectCodeV1 {
  COMMUNICATION_SUMMARY_SOURCE_REJECT_CODE_UNSPECIFIED = 0;
  COMMUNICATION_SUMMARY_SOURCE_REJECT_CODE_INVALID_REQUEST = 1;
  COMMUNICATION_SUMMARY_SOURCE_REJECT_CODE_SOURCE_MISSING_OR_INACTIVE = 2;
  COMMUNICATION_SUMMARY_SOURCE_REJECT_CODE_STALE_REVISION = 3;
  COMMUNICATION_SUMMARY_SOURCE_REJECT_CODE_CONTENT_UNAVAILABLE = 4;
  COMMUNICATION_SUMMARY_SOURCE_REJECT_CODE_INVALID_UTF8 = 5;
  COMMUNICATION_SUMMARY_SOURCE_REJECT_CODE_CONTENT_LIMIT = 6;
  COMMUNICATION_SUMMARY_SOURCE_REJECT_CODE_POLICY = 7;
}
