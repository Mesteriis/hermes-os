[package]
name = "hermes-review-attention-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hermes-review-attention-runtime"
path = "src/main.rs"

[package.metadata.hermes]
role = "domain"
owner = "review"
surface = "runtime"

[dependencies]
hermes-review-attention-api = { path = "../review-attention-api" }
hermes-review-attention-core = { path = "../review-attention-core" }
hermes-review-attention-persistence = { path = "../review-attention-persistence" }
hermes-runtime-protocol = { path = "../platform/runtime_protocol" }
hermes-storage-protocol = { path = "../platform/storage/protocol" }
hermes-storage-vault = { path = "../platform/storage/vault" }
libc = "=0.2.186"
prost = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.52.4", default-features = false, features = ["rt-multi-thread", "time"] }
zeroize = "=1.9.0"
