syntax = "proto3";

package hermes.communications.anchor.v1;

// Public owner handoff for an integration that already published the source
// observation. It has no provider locator, attachment bytes, or descriptor.
message CommunicationAttachmentAnchorRecordedV1 {
  bytes attachment_anchor_id = 1;
  bytes source_observation_id = 2;
  bytes media_cursor_sha256 = 3;
  CommunicationAttachmentAnchorInitialStateV1 initial_state = 4;
  int64 observed_at_unix_seconds = 5;
}

enum CommunicationAttachmentAnchorInitialStateV1 {
  COMMUNICATION_ATTACHMENT_ANCHOR_INITIAL_STATE_V1_UNSPECIFIED = 0;
  COMMUNICATION_ATTACHMENT_ANCHOR_INITIAL_STATE_V1_DESCRIPTOR_ONLY = 1;
}
