[package]
name = "hermes-mail-contacts-sync-assembly"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hermes-mail-contacts-sync-assembly"
path = "src/main.rs"

[package.metadata.hermes]
role = "workflow"
owner = "mail_contacts_sync"
surface = "assembly"

[dependencies]
hermes-mail-contacts-sync-persistence = { path = "../mail-contacts-sync-persistence" }
hermes-mail-contacts-sync-runtime = { path = "../mail-contacts-sync-runtime" }
hermes-runtime-protocol = { path = "../platform/runtime_protocol" }
hermes-storage-protocol = { path = "../platform/storage/protocol" }
prost = "=0.14.4"
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = "=1.0.150"
