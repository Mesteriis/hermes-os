[package]
name = "hermes-communication-reply-suggestion-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hermes-communication-reply-suggestion-runtime"
path = "src/main.rs"

[package.metadata.hermes]
role = "workflow"
owner = "communication_reply_suggestion"
surface = "runtime"

[dependencies]
hermes-ai-contracts = { path = "../ai-contracts" }
hermes-blob-client = { path = "../platform/blob/client" }
hermes-communication-reply-suggestion-api = { path = "../communication-reply-suggestion-api" }
hermes-communication-reply-suggestion-core = { path = "../communication-reply-suggestion-core" }
hermes-communication-reply-suggestion-persistence = { path = "../communication-reply-suggestion-persistence" }
hermes-communications-ai-source-api = { path = "../communications-ai-source-api" }
hermes-events-jetstream = { path = "../platform/events/jetstream" }
hermes-events-protocol = { path = "../platform/events" }
hermes-runtime-protocol = { path = "../platform/runtime_protocol" }
hermes-storage-protocol = { path = "../platform/storage/protocol" }
hermes-storage-vault = { path = "../platform/storage/vault" }
libc = "=0.2.186"
prost = "=0.14.4"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.52.4", default-features = false, features = ["rt-multi-thread", "time"] }
zeroize = "=1.9.0"
