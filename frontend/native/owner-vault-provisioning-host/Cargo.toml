[package]
name = "hermes-owner-vault-provisioning-host"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hermes-owner-vault-development-host"
path = "src/bin/development_host.rs"
required-features = ["development-server"]

[package.metadata.hermes]
role = "app"
owner = "first_party_client"
surface = "host_adapter"

[features]
default = []
development-server = ["dep:serde", "dep:serde_json", "dep:tiny_http"]

[dependencies]
hermes-vault-protocol = { path = "../../../backend/src/platform/vault/protocol" }
serde = { version = "=1.0.228", features = ["derive"], optional = true }
serde_json = { version = "=1.0.150", optional = true }
sha2 = { version = "=0.11.0", default-features = false }
tiny_http = { version = "=0.12.0", optional = true }
zeroize = "=1.9.0"
